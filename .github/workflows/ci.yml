name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # main 에서만 캐시를 쓰고(write), PR 은 읽기만 한다.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 네이버 지도 키·API 주소 없이 빌드된다 (지도는 안내 문구, 데이터는 Fake).
      - name: make check
        run: make check

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/"
          retention-days: 7
