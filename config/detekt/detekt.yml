# Built on top of detekt's default config (buildUponDefaultConfig = true).
# Only overrides live here. Keep it short; prefer fixing code over relaxing rules.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 15
    thresholdInFiles: 20
    ignorePrivate: true

style:
  MagicNumber:
    excludes: ['**/test/**', '**/fake/**', '**/ui/theme/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 3
